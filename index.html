<!doctype html>
<html lang="my">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#D4A574">
  <meta name="description" content="Myanmar convenience store and minimart finder">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <title>Myanmar Minimart Finder</title>
  <style>
    :root {
      --bg: #fefdfb;
      --surface: #ffffff;
      --text: #2b2520;
      --text-muted: #8b7d6f;
      --border: #e8dcc8;
      --accent: #D4A574;
      --accent-light: #faf3e8;
      --shadow-sm: 0 1px 2px rgba(43,37,32,.04);
      --shadow: 0 4px 12px rgba(43,37,32,.08);
    }

    * { box-sizing: border-box; }
    html, body { margin: 0; padding: 0; }
    body {
      background: var(--bg);
      color: var(--text);
      font-family: "Myanmar Text", "Noto Sans Myanmar", "Padauk", system-ui, sans-serif;
      line-height: 1.5;
    }

    .container {
      max-width: 640px;
      margin: 0 auto;
      padding: 16px 14px 48px;
    }

    /* Header */
    header {
      margin-bottom: 24px;
    }
    .logo {
      font-size: 2rem;
      font-weight: 900;
      color: var(--accent);
      margin: 0 0 4px;
      letter-spacing: -0.02em;
    }
    .subtitle {
      font-size: 0.9rem;
      color: var(--text-muted);
    }

    /* City Selector */
    .city-selector {
      display: flex;
      gap: 8px;
      margin-bottom: 16px;
      padding-bottom: 12px;
      border-bottom: 2px solid var(--border);
    }
    .city-btn {
      padding: 8px 14px;
      border: 2px solid var(--border);
      border-radius: 6px;
      background: var(--surface);
      cursor: pointer;
      font-size: 0.85rem;
      font-weight: 600;
      transition: all 0.2s;
    }
    .city-btn:hover {
      border-color: var(--accent);
      background: var(--accent-light);
    }
    .city-btn.active {
      background: var(--accent);
      color: white;
      border-color: var(--accent);
    }

    /* Search */
    .search-box {
      display: flex;
      gap: 8px;
      margin-bottom: 20px;
    }
    .search-box input {
      flex: 1;
      padding: 12px 14px;
      border: 2px solid var(--border);
      border-radius: 8px;
      background: var(--surface);
      font-size: 1rem;
      outline: none;
      transition: all 0.2s;
    }
    .search-box input:focus {
      border-color: var(--accent);
      box-shadow: 0 0 0 2px var(--accent-light);
    }
    .search-box button {
      padding: 12px 20px;
      background: var(--accent);
      color: white;
      border: none;
      border-radius: 8px;
      font-weight: 700;
      cursor: pointer;
      font-size: 0.9rem;
      transition: all 0.2s;
    }
    .search-box button:hover {
      background: #c9985f;
      transform: translateY(-1px);
      box-shadow: var(--shadow);
    }

    /* Quick actions */
    .actions {
      display: grid;
      grid-template-columns: 1fr 1fr 1fr;
      gap: 8px;
      margin-bottom: 20px;
    }
    .action-btn {
      padding: 10px 8px;
      background: var(--surface);
      border: 2px solid var(--border);
      border-radius: 8px;
      cursor: pointer;
      font-size: 0.85rem;
      font-weight: 600;
      text-align: center;
      transition: all 0.2s;
    }
    .action-btn:hover {
      border-color: var(--accent);
      background: var(--accent-light);
    }
    .action-btn.active {
      background: var(--accent);
      color: white;
      border-color: var(--accent);
    }

    /* Filters */
    .filters-scroll {
      display: flex;
      gap: 8px;
      overflow-x: auto;
      padding-bottom: 8px;
      margin-bottom: 16px;
      scrollbar-width: none;
    }
    .filters-scroll::-webkit-scrollbar { display: none; }
    .filter-chip {
      white-space: nowrap;
      padding: 8px 12px;
      border: 2px solid var(--border);
      border-radius: 20px;
      background: var(--surface);
      cursor: pointer;
      font-size: 0.85rem;
      font-weight: 500;
      transition: all 0.2s;
    }
    .filter-chip:hover {
      border-color: var(--accent);
      background: var(--accent-light);
    }
    .filter-chip.active {
      background: var(--accent);
      color: white;
      border-color: var(--accent);
    }

    /* Results header */
    .results-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 12px;
      padding-bottom: 8px;
      border-bottom: 2px solid var(--border);
    }
    .result-count {
      font-weight: 600;
      color: var(--accent);
    }

    /* Cards */
    .cards {
      display: grid;
      gap: 12px;
    }
    .card {
      background: var(--surface);
      border: 2px solid var(--border);
      border-radius: 12px;
      padding: 14px;
      box-shadow: var(--shadow-sm);
      transition: all 0.2s;
    }
    .card:hover {
      box-shadow: var(--shadow);
      border-color: var(--accent);
      background: var(--accent-light);
    }

    .card-header {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      gap: 10px;
      margin-bottom: 8px;
    }
    .card-title {
      font-weight: 700;
      font-size: 1rem;
      color: var(--text);
    }
    .card-badge {
      font-size: 1.2rem;
      cursor: pointer;
      transition: all 0.2s;
    }
    .card-badge.active {
      transform: scale(1.3);
    }

    .card-meta {
      display: flex;
      gap: 6px;
      font-size: 0.75rem;
      color: var(--text-muted);
      margin-bottom: 8px;
    }
    .meta-tag {
      background: var(--accent-light);
      color: var(--accent);
      padding: 2px 6px;
      border-radius: 4px;
      font-weight: 600;
    }

    .card-address {
      font-size: 0.9rem;
      color: var(--text);
      margin-bottom: 8px;
      line-height: 1.5;
    }
    .card-phone {
      font-size: 0.9rem;
      margin-bottom: 10px;
    }
    .card-phone a {
      color: var(--accent);
      text-decoration: none;
      font-weight: 600;
    }
    .card-distance {
      font-size: 0.8rem;
      color: var(--accent);
      font-weight: 600;
      margin-bottom: 10px;
    }

    .card-actions {
      display: flex;
      gap: 6px;
    }
    .card-link {
      flex: 1;
      padding: 8px 10px;
      border: 2px solid var(--border);
      border-radius: 6px;
      background: var(--surface);
      text-decoration: none;
      text-align: center;
      font-size: 0.8rem;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s;
      color: var(--text);
    }
    .card-link:hover {
      border-color: var(--accent);
      background: var(--accent);
      color: white;
    }

    /* Empty state */
    .empty {
      text-align: center;
      padding: 48px 16px;
      color: var(--text-muted);
    }
    .empty-icon {
      font-size: 3rem;
      margin-bottom: 12px;
    }

    /* Modal */
    dialog {
      border: none;
      border-radius: 12px;
      width: min(90vw, 480px);
      padding: 24px;
      background: var(--surface);
      box-shadow: 0 20px 60px rgba(43,37,32,.15);
    }
    dialog::backdrop {
      background: rgba(43,37,32,.4);
    }
    .modal-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 16px;
    }
    .modal-header h2 {
      margin: 0;
      font-size: 1.2rem;
      color: var(--accent);
    }
    .close-btn {
      background: none;
      border: none;
      font-size: 1.5rem;
      cursor: pointer;
      color: var(--text-muted);
    }

    .form-group {
      display: grid;
      gap: 8px;
      margin-bottom: 12px;
    }
    .form-group label {
      font-size: 0.85rem;
      font-weight: 600;
      color: var(--text);
    }
    .form-group input,
    .form-group select {
      padding: 10px 12px;
      border: 2px solid var(--border);
      border-radius: 6px;
      font-size: 0.95rem;
      font-family: inherit;
      background: var(--surface);
      color: var(--text);
    }
    .form-group input:focus,
    .form-group select:focus {
      outline: none;
      border-color: var(--accent);
      box-shadow: 0 0 0 2px var(--accent-light);
    }

    .modal-footer {
      display: flex;
      gap: 8px;
      margin-top: 16px;
    }
    .btn-primary {
      flex: 1;
      padding: 12px;
      background: var(--accent);
      color: white;
      border: none;
      border-radius: 6px;
      font-weight: 700;
      cursor: pointer;
      transition: all 0.2s;
    }
    .btn-primary:hover {
      background: #c9985f;
    }
    .btn-secondary {
      flex: 1;
      padding: 12px;
      background: var(--accent-light);
      color: var(--accent);
      border: 2px solid var(--border);
      border-radius: 6px;
      font-weight: 700;
      cursor: pointer;
      transition: all 0.2s;
    }
    .btn-secondary:hover {
      border-color: var(--accent);
    }

    /* Toast */
    .toast {
      position: fixed;
      bottom: 20px;
      left: 50%;
      transform: translateX(-50%);
      background: var(--text);
      color: white;
      padding: 12px 16px;
      border-radius: 6px;
      font-size: 0.9rem;
      max-width: 85vw;
      z-index: 50;
      box-shadow: var(--shadow);
    }

    /* Dark mode */
    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #1a1410;
        --surface: #2a2420;
        --text: #f0e8e0;
        --text-muted: #a89880;
        --border: #3d3530;
        --accent: #E8B887;
        --accent-light: rgba(232,184,135,.12);
      }
    }

    /* Mobile */
    @media (max-width: 480px) {
      .container { padding: 12px 12px 40px; }
      .logo { font-size: 1.5rem; }
      .search-box { flex-direction: column; }
      .actions { grid-template-columns: 1fr 1fr; }
      dialog { width: 95vw; padding: 16px; }
      .city-selector { flex-wrap: wrap; }
    }
  </style>
</head>
<body>
  <div class="container">
    <header>
      <div class="logo">🏪 Myanmar Minimart</div>
      <div class="subtitle">CoCo · G&G · Lar Lar · City Mart ရှာဖွေရေး</div>
    </header>

    <div class="city-selector" id="citySelector"></div>

    <div class="search-box">
      <input id="search" type="search" placeholder="လမ်း / နံပါတ် / မြို့နယ် ရိုက်ပါ" aria-label="Search">
      <button type="button" id="searchBtn">ရှာမည်</button>
    </div>

    <div class="actions">
      <button type="button" class="action-btn" id="locBtn">📍 အနီးဆုံး</button>
      <button type="button" class="action-btn" id="favBtn">⭐ ပိုင်းစိတ်များ</button>
      <button type="button" class="action-btn" id="addBtn">➕ ထည့်သည်</button>
    </div>

    <div class="filters-scroll" id="brands"></div>
    <div class="filters-scroll" id="towns"></div>

    <div class="results-header">
      <span class="result-count" id="count">ဒေတာဖတ်နေသည်…</span>
    </div>

    <section class="cards" id="cards"></section>
  </div>

  <dialog id="modal">
    <div class="modal-header">
      <h2>ဆိုင်အသစ်ထည့်ရန်</h2>
      <button type="button" class="close-btn" id="closeBtn">✕</button>
    </div>
    <form id="addForm">
      <div class="form-group">
        <label>ဆိုင်အမျိုးအစား</label>
        <select id="fBrand" required>
          <option value="CoCo">CoCo</option>
          <option value="G&G">G&G</option>
          <option value="Lar Lar">Lar Lar</option>
          <option value="City Mart">City Mart</option>
          <option value="Other">အခြား</option>
        </select>
      </div>
      <div class="form-group">
        <label>ဆိုင်အမည်</label>
        <input id="fName" type="text" placeholder="CoCo Branch 1" required>
      </div>
      <div class="form-group">
        <label>လိပ်စာ</label>
        <input id="fAddr" type="text" placeholder="(84) လမ်း၊ (30x77)" required>
      </div>
      <div class="form-group">
        <label>မြို့နယ် / ရှပ်</label>
        <input id="fTown" type="text" placeholder="ချမ်းအေးသာစံ" required>
      </div>
      <div class="form-group">
        <label>ဖုန်း</label>
        <input id="fPhone" type="tel" placeholder="09-xxxxxxxxx">
      </div>
      <div class="form-group">
        <button type="button" class="card-link" id="fGps">📍 တည်နေရာယူမည်</button>
      </div>
      <div class="modal-footer">
        <button type="button" class="btn-secondary" id="cancelBtn">မထည့်ပါ</button>
        <button type="submit" class="btn-primary">ထည့်မည်</button>
      </div>
    </form>
  </dialog>

  <script>
    const BRANDS = [
      ['all', 'အားလုံး'],
      ['CoCo', 'CoCo'],
      ['G&G', 'G&G'],
      ['Lar Lar', 'Lar Lar'],
      ['City Mart', 'City Mart'],
      ['Other', 'အခြား']
    ];

    const CITIES = [
      ['Mandalay', 'မန္တလေး'],
      ['Yangon', 'ရန်ကုန်'],
      ['Naypyidaw', 'နေပြည်တော်'],
      ['Bagan', 'ပုဂ္ဂလိက'],
      ['Taunggyi', 'တောင်ကြီး'],
      ['All', 'အားလုံး']
    ];

    const state = {
      shops: [],
      mine: [],
      brand: 'all',
      town: 'all',
      city: 'Mandalay',
      query: '',
      favOnly: false,
      pos: null,
      favs: new Set()
    };

    const $ = (sel) => document.querySelector(sel);
    const $$ = (sel) => [...document.querySelectorAll(sel)];

    function esc(str) {
      const div = document.createElement('div');
      div.textContent = str;
      return div.innerHTML;
    }

    function norm(str) {
      const mm = '၀၁၂၃၄၅၆၇၈၉';
      return String(str || '')
        .toLowerCase()
        .replace(/[၀-၉]/g, c => mm.indexOf(c))
        .replace(/[×✕*]/g, 'x')
        .replace(/\s*x\s*/g, 'x')
        .replace(/\s+/g, ' ')
        .trim();
    }

    function toast(msg) {
      const el = document.createElement('div');
      el.className = 'toast';
      el.textContent = msg;
      document.body.appendChild(el);
      setTimeout(() => el.remove(), 2400);
    }

    function dist(lat1, lon1, lat2, lon2) {
      const R = 6371;
      const dLat = ((lat2 - lat1) * Math.PI) / 180;
      const dLon = ((lon2 - lon1) * Math.PI) / 180;
      const a = Math.sin(dLat / 2) ** 2 + Math.cos((lat1 * Math.PI) / 180) * Math.cos((lat2 * Math.PI) / 180) * Math.sin(dLon / 2) ** 2;
      return 2 * R * Math.asin(Math.sqrt(a));
    }

    function mapsUrl(shop) {
      if (shop.lat && shop.lng) return `https://www.google.com/maps/search/?api=1&query=${shop.lat},${shop.lng}`;
      return `https://www.google.com/maps/search/?api=1&query=${encodeURIComponent(shop.address_mm || shop.name || '')} ${shop.city_mm}`;
    }

    function save() {
      try { localStorage.setItem('favs', JSON.stringify([...state.favs])); } catch (e) {}
      try { localStorage.setItem('mine', JSON.stringify(state.mine)); } catch (e) {}
    }

    function render() {
      const q = norm(state.query).split(' ').filter(Boolean);
      let rows = state.shops.concat(state.mine).filter(s => {
        const hay = norm([s.brand_name, s.name, s.branch, s.address_mm, s.township_mm, s.phone].join(' '));
        return (state.brand === 'all' || s.brand_name === state.brand) &&
               (state.town === 'all' || s.township_mm === state.town) &&
               (state.city === 'All' || s.city_mm === state.city) &&
               (!state.favOnly || state.favs.has(s.id)) &&
               q.every(t => hay.includes(t));
      });

      if (state.pos) {
        rows = rows.map(s => ({ ...s, _d: s.lat && s.lng ? dist(state.pos.lat, state.pos.lng, s.lat, s.lng) : null }))
          .sort((a, b) => (a._d ?? 999) - (b._d ?? 999));
      }

      $('#count').textContent = `${rows.length} ဆိုင်`;

      $('#cards').innerHTML = !rows.length ? '<div class="empty"><div class="empty-icon">🔍</div>သည်မည်သည့်အချက်အလက်မျှမတွေ့ပါ</div>'
        : rows.map((s, i) => {
          const isFav = state.favs.has(s.id);
          const dist = s._d ? `<div class="card-distance">📍 ${s._d.toFixed(1)} km</div>` : '';
          return `
            <div class="card">
              <div class="card-header">
                <div class="card-title">${esc(s.brand_name || 'Minimart')} ${esc(s.branch || '')}</div>
                <button class="card-badge ${isFav ? 'active' : ''}" data-fav="${esc(s.id)}">★</button>
              </div>
              <div class="card-meta">
                <span class="meta-tag">${esc(s.township_mm || 'Myanmar')}</span>
              </div>
              <div class="card-address">${esc(s.address_mm || s.name || 'လိပ်စာမရှိ')}</div>
              ${s.phone ? `<div class="card-phone">☎ <a href="tel:${encodeURIComponent(s.phone)}">${esc(s.phone)}</a></div>` : ''}
              ${dist}
              <div class="card-actions">
                <a class="card-link" target="_blank" rel="noopener" href="${mapsUrl(s)}">Maps</a>
                ${s.foodpanda_url ? `<a class="card-link" target="_blank" rel="noopener" href="${s.foodpanda_url}">Food</a>` : ''}
                <button class="card-link" type="button" data-share="${i}">Share</button>
              </div>
            </div>
          `;
        }).join('');

      $$('[data-fav]').forEach(b => {
        b.onclick = () => {
          const id = b.dataset.fav;
          state.favs.has(id) ? state.favs.delete(id) : state.favs.add(id);
          save();
          render();
        };
      });

      $$('[data-share]').forEach(b => {
        b.onclick = () => {
          const s = rows[+b.dataset.share];
          const txt = `${s.brand_name} ${s.branch || ''}\n${s.address_mm || ''}\n${s.phone || ''}\n${mapsUrl(s)}`;
          navigator.share ? navigator.share({ text: txt }) : navigator.clipboard?.writeText(txt).then(() => toast('Copied'));
        };
      });

      // Render brand filters
      $('#brands').innerHTML = BRANDS.map(([v, l]) => `
        <button class="filter-chip ${state.brand === v ? 'active' : ''}" data-brand="${v}">${esc(l)}</button>
      `).join('');
      $$('#brands [data-brand]').forEach(b => { b.onclick = () => { state.brand = b.dataset.brand; render(); }; });

      // Render town filters
      const towns = [...new Set(state.shops.concat(state.mine).filter(s => state.city === 'All' || s.city_mm === state.city).map(s => s.township_mm).filter(Boolean))].sort();
      $('#towns').innerHTML = [['all', 'မြို့နယ်အားလုံး'], ...towns.map(t => [t, t])]
        .map(([v, l]) => `<button class="filter-chip ${state.town === v ? 'active' : ''}" data-town="${v}">${esc(l)}</button>`).join('');
      $$('#towns [data-town]').forEach(b => { b.onclick = () => { state.town = b.dataset.town; render(); }; });
    }

    function renderCities() {
      $('#citySelector').innerHTML = CITIES.map(([v, l]) => `
        <button type="button" class="city-btn ${state.city === v ? 'active' : ''}" data-city="${v}">${esc(l)}</button>
      `).join('');
      $$('#citySelector [data-city]').forEach(b => {
        b.onclick = () => {
          state.city = b.dataset.city;
          state.town = 'all';
          renderCities();
          render();
        };
      });
    }

    function loadData() {
      fetch('shops.json')
        .then(r => r.json())
        .then(d => {
          state.shops = d.shops || [];
          state.mine = JSON.parse(localStorage.getItem('mine') || '[]');
          state.favs = new Set(JSON.parse(localStorage.getItem('favs') || '[]'));
          renderCities();
          render();
        })
        .catch(() => {
          $('#cards').innerHTML = '<div class="empty"><div class="empty-icon">⚠️</div>ဒေတာမတွေ့ပါ</div>';
        });
    }

    $('#search').addEventListener('input', (e) => { state.query = e.target.value; render(); });
    $('#searchBtn').addEventListener('click', () => render());

    $('#locBtn').addEventListener('click', () => {
      if (!navigator.geolocation) return toast('GPS မရနိုင်');
      toast('တည်နေရာယူနေသည်…');
      navigator.geolocation.getCurrentPosition(
        (p) => { state.pos = { lat: p.coords.latitude, lng: p.coords.longitude }; toast('ရပြီ'); render(); },
        () => toast('တည်နေရာ ရယူမရခဲ့')
      );
    });

    $('#favBtn').addEventListener('click', () => { state.favOnly = !state.favOnly; $('#favBtn').classList.toggle('active', state.favOnly); render(); });

    $('#closeBtn').addEventListener('click', () => $('#modal').close());
    $('#cancelBtn').addEventListener('click', () => $('#modal').close());

    let fPos = null;
    $('#addBtn').addEventListener('click', () => {
      fPos = null;
      $('#fGps').textContent = '📍 တည်နေရာယူမည်';
      $('#modal').showModal();
    });

    $('#fGps').addEventListener('click', () => {
      if (!navigator.geolocation) return toast('GPS မရ');
      navigator.geolocation.getCurrentPosition(
        (p) => { fPos = { lat: p.coords.latitude, lng: p.coords.longitude }; $('#fGps').textContent = '✓ ရပြီ'; },
        () => toast('တည်နေရာ ရယူမရခဲ့')
      );
    });

    $('#addForm').addEventListener('submit', (e) => {
      e.preventDefault();
      state.mine.push({
        id: 'my-' + Date.now(),
        brand_name: $('#fBrand').value,
        name: $('#fName').value,
        branch: '',
        address_mm: $('#fAddr').value,
        township_mm: $('#fTown').value,
        city_mm: state.city,
        phone: $('#fPhone').value,
        lat: fPos?.lat,
        lng: fPos?.lng
      });
      save();
      $('#modal').close();
      $('#addForm').reset();
      toast('ထည့်ပြီးပါပြီ');
      render();
    });

    loadData();
  </script>
</body>
</html>
