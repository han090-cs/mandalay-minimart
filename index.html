<!doctype html>
<html lang="my">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#183f3a">
  <meta name="description" content="Mandalay minimart finder for CoCo, G&G, Lar Lar and other convenience brands.">
  <title>Mandalay Minimart Finder</title>
  <style>
    :root {
      --bg: #edf5f2;
      --panel: #f8fcfa;
      --card: #ffffff;
      --text: #17322f;
      --muted: #66807b;
      --accent: #1d6b61;
      --accent-2: #d9eee8;
      --border: #d4e4df;
      --shadow: 0 10px 28px rgba(28,70,63,.08);
      --danger: #d65f5f;
      --toast: rgba(11, 30, 27, .92);
    }

    * { box-sizing: border-box; }
    html, body { margin: 0; padding: 0; }
    body {
      background: var(--bg);
      color: var(--text);
      font-family: "Myanmar Text", "Noto Sans Myanmar", "Padauk", "Pyidaungsu", system-ui, sans-serif;
      min-height: 100vh;
    }
    a { color: inherit; }
    button, input, select { font: inherit; }

    .wrap {
      max-width: 760px;
      margin: 0 auto;
      padding: 18px 14px 48px;
    }

    .hero {
      padding: 8px 4px 18px;
    }
    .brand {
      font-size: clamp(1.7rem, 5vw, 2.3rem);
      font-weight: 900;
      letter-spacing: -0.02em;
    }
    .tag {
      color: var(--muted);
      font-size: 0.9rem;
      margin-top: 4px;
      line-height: 1.5;
    }

    .searchbox {
      display: flex;
      gap: 8px;
      margin-bottom: 12px;
    }
    .searchbox input {
      flex: 1;
      min-width: 0;
      height: 50px;
      border: 1px solid var(--border);
      border-radius: 16px;
      background: var(--panel);
      color: var(--text);
      padding: 0 15px;
      font-size: 1rem;
      outline: none;
    }
    .searchbox input:focus {
      border-color: var(--accent);
      box-shadow: 0 0 0 3px rgba(29,107,97,0.12);
    }
    .searchbtn {
      height: 50px;
      border: 0;
      border-radius: 16px;
      background: var(--accent);
      color: white;
      font-weight: 800;
      padding: 0 18px;
      cursor: pointer;
    }

    .toolbar {
      display: flex;
      gap: 8px;
      margin: 10px 0 12px;
    }
    .toolbar button {
      flex: 1;
      min-height: 46px;
      border-radius: 14px;
      border: 1px solid var(--border);
      background: var(--panel);
      color: var(--text);
      font-weight: 800;
      cursor: pointer;
    }
    .toolbar .active {
      background: var(--accent-2);
      border-color: var(--accent);
    }

    .brands, .filters {
      display: flex;
      gap: 7px;
      overflow-x: auto;
      padding: 2px 1px 10px;
      scrollbar-width: none;
    }
    .brands::-webkit-scrollbar, .filters::-webkit-scrollbar { display: none; }
    .chip {
      white-space: nowrap;
      border: 1px solid var(--border);
      border-radius: 999px;
      background: var(--panel);
      color: var(--text);
      padding: 7px 12px;
      font-weight: 700;
      cursor: pointer;
    }
    .chip.active {
      background: var(--accent);
      color: white;
      border-color: var(--accent);
    }

    .live {
      background: var(--accent-2);
      border: 1px dashed var(--accent);
      border-radius: 18px;
      padding: 14px;
      margin-bottom: 12px;
    }
    .live h3 {
      margin: 0 0 8px;
      font-size: 1rem;
    }
    .actions {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
    }
    .act {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-height: 36px;
      padding: 0 10px;
      border-radius: 10px;
      background: var(--card);
      color: var(--text);
      text-decoration: none;
      border: 1px solid var(--border);
      font-size: 0.84rem;
      font-weight: 700;
    }

    .bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 10px;
      margin: 8px 2px 12px;
      color: var(--muted);
      font-size: 0.82rem;
    }

    .cards {
      display: grid;
      gap: 12px;
    }
    .card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 18px;
      padding: 14px 14px 12px;
      box-shadow: var(--shadow);
    }
    .top {
      display: flex;
      justify-content: space-between;
      gap: 10px;
      align-items: flex-start;
    }
    .name {
      font-weight: 800;
      font-size: 1.05rem;
      margin-bottom: 5px;
      line-height: 1.4;
    }
    .meta {
      font-size: 0.78rem;
      color: var(--muted);
      margin-bottom: 4px;
    }
    .addr {
      margin-top: 8px;
      line-height: 1.65;
      font-size: 0.92rem;
    }
    .phone {
      margin-top: 8px;
      font-size: 0.9rem;
    }
    .phone a {
      color: var(--accent);
      font-weight: 700;
      text-decoration: none;
    }
    .tags {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      margin-top: 10px;
    }
    .tag2 {
      font-size: 0.7rem;
      padding: 4px 8px;
      border-radius: 999px;
      background: var(--accent-2);
      color: var(--accent);
      border: 1px solid rgba(29,107,97,0.15);
      font-weight: 700;
    }
    .actions-row {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin-top: 12px;
    }
    .mini-btn {
      background: var(--panel);
      color: var(--text);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 8px 10px;
      cursor: pointer;
      font-weight: 700;
      text-decoration: none;
    }
    .fav {
      border: 0;
      background: none;
      font-size: 1.4rem;
      line-height: 1;
      padding: 0 4px;
      color: var(--muted);
      cursor: pointer;
    }
    .fav.on {
      color: #e8a200;
    }
    .dist {
      font-size: 0.7rem;
      color: var(--accent);
      font-weight: 800;
      margin-top: 4px;
    }

    dialog {
      border: 0;
      border-radius: 22px;
      width: min(92vw, 520px);
      padding: 0;
      background: var(--card);
      color: var(--text);
      box-shadow: 0 24px 80px rgba(0,0,0,.25);
    }
    dialog::backdrop {
      background: rgba(10,35,31,.45);
    }
    .modal {
      padding: 18px 18px 16px;
    }
    .close {
      position: absolute;
      right: 16px;
      top: 12px;
      width: 32px;
      height: 32px;
      border: 0;
      background: rgba(0,0,0,.05);
      border-radius: 50%;
      font-size: 1.2rem;
      cursor: pointer;
    }
    .modal h2 {
      margin: 0 0 8px;
      font-size: 1.2rem;
    }
    .meta-line {
      color: var(--muted);
      font-size: 0.85rem;
      margin-bottom: 14px;
    }
    .fm {
      display: grid;
      gap: 10px;
    }
    .fm input, .fm select {
      height: 46px;
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 0 12px;
      background: var(--panel);
      color: var(--text);
      font: inherit;
    }
    .actions-footer {
      display: flex;
      justify-content: flex-end;
      gap: 8px;
      margin-top: 14px;
    }
    .primary-btn, .secondary-btn {
      border: 0;
      border-radius: 12px;
      padding: 10px 14px;
      cursor: pointer;
      font-weight: 800;
    }
    .primary-btn {
      background: var(--accent);
      color: white;
    }
    .secondary-btn {
      background: var(--panel);
      color: var(--text);
      border: 1px solid var(--border);
    }

    .empty {
      text-align: center;
      padding: 32px 18px;
      border: 1px dashed var(--border);
      border-radius: 16px;
      background: rgba(255,255,255,0.5);
      color: var(--muted);
    }

    .toast {
      position: fixed;
      left: 50%;
      bottom: 22px;
      transform: translateX(-50%);
      background: var(--toast);
      color: white;
      padding: 11px 16px;
      border-radius: 14px;
      font-size: 0.88rem;
      z-index: 30;
      max-width: 90vw;
      box-shadow: 0 10px 20px rgba(0,0,0,.18);
    }

    @media (max-width: 420px) {
      .wrap { padding-left: 10px; padding-right: 10px; }
      .toolbar { flex-direction: column; }
      .searchbox { flex-direction: column; }
      .searchbtn { width: 100%; }
    }

    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #0f1b19;
        --panel: #172825;
        --card: #1b2d2a;
        --text: #e6f2ef;
        --muted: #93aaa5;
        --accent: #2a9d8f;
        --accent-2: #1f3d38;
        --border: #2b4540;
        --shadow: 0 10px 28px rgba(0,0,0,.18);
        --toast: rgba(5,14,12,.94);
      }
      .searchbox input, .chip, .mini-btn, .secondary-btn, .fm input, .fm select, .toolbar button {
        color: var(--text);
      }
      .card, .live, .modal, .empty {
        background: var(--card);
      }
    }
  </style>
</head>
<body>
  <main class="wrap">
    <header class="hero">
      <div class="brand">Mandalay Minimart</div>
      <div class="tag">မန္တလေး CoCo · G&amp;G · Lar Lar · minimarket ရှာဖွေရေး</div>
    </header>

    <form class="searchbox" id="searchForm">
      <input id="search" type="search" placeholder="လမ်းနာမည် / နံပါတ် / မြို့နယ် ရိုက်ပါ" aria-label="Search shops">
      <button class="searchbtn" type="submit">ရှာမည်</button>
    </form>

    <div class="toolbar">
      <button type="button" id="locBtn">📍 ကျွန်တော့်အနီးဆုံး</button>
      <button type="button" id="delBtn">🛵 ရှာရန်</button>
      <button type="button" id="favBtn">⭐ ပိုင်းစိတ်များ</button>
    </div>

    <nav class="brands" id="brands" aria-label="Brand filters"></nav>
    <div id="live"></div>
    <nav class="filters" id="filters" aria-label="Township filters"></nav>

    <div class="bar">
      <span id="count">ဒေတာဖတ်နေသည်…</span>
      <span>Updated 03 Oct 2026</span>
    </div>

    <section class="cards" id="cards"></section>
  </main>

  <dialog id="dialog">
    <div class="modal" style="position:relative">
      <button class="close" id="close" aria-label="Close">×</button>
      <h2>ဆိုင်အသစ်ထည့်ရန်</h2>
      <div class="meta-line">သင့်လက်မှတ် တည်နေရာနှင့် မိမိထည့်ချင်သော အချက်အလက်ကို ပေးနိုင်ပါတယ်။</div>
      <form id="addForm" class="fm">
        <select id="fBrand" required>
          <option value="CoCo">CoCo</option>
          <option value="G&G">G&G</option>
          <option value="Lar Lar">Lar Lar</option>
          <option value="City Mart">City Mart</option>
          <option value="Ocean">Ocean</option>
          <option value="Capital">Capital</option>
          <option value="minimart">minimart</option>
        </select>
        <input id="fName" type="text" placeholder="ဆိုင်အမည်" required>
        <input id="fAddr" type="text" placeholder="လိပ်စာ" required>
        <input id="fTown" type="text" placeholder="မြို့နယ်" required>
        <input id="fPhone" type="text" placeholder="ဖုန်းနံပါတ်">
        <button type="button" class="secondary-btn" id="fGps">📍 တည်နေရာယူမည်</button>
        <div class="actions-footer">
          <button type="button" class="secondary-btn" id="fCancel">မထည့်ပါ</button>
          <button type="submit" class="primary-btn">ထည့်မည်</button>
        </div>
      </form>
    </div>
  </dialog>

  <script>
    const BRANDS = [
      ['all', 'အားလုံး', ''],
      ['CoCo', 'CoCo', 'CoCo Convenience Store'],
      ['G&G', 'G&G', 'g&g Grab & Go'],
      ['Lar Lar', 'Lar Lar', 'Lar Lar minimart'],
      ['City Mart', 'City Mart', 'City Mart'],
      ['Ocean', 'Ocean', 'Ocean'],
      ['Capital', 'Capital', 'Capital'],
      ['minimart', 'minimart', 'minimart']
    ];

    const state = {
      shops: [],
      mine: [],
      town: 'all',
      brand: 'all',
      q: '',
      del: false,
      favOnly: false,
      pos: null,
      favs: new Set()
    };

    const $ = (selector) => document.querySelector(selector);
    const $$ = (selector) => Array.from(document.querySelectorAll(selector));

    function toast(message) {
      const node = document.createElement('div');
      node.className = 'toast';
      node.textContent = message;
      document.body.appendChild(node);
      setTimeout(() => node.remove(), 2600);
    }

    function saveFavs() {
      try { localStorage.setItem('favs', JSON.stringify([...state.favs])); } catch (e) {}
    }

    function saveMine() {
      try { localStorage.setItem('mine', JSON.stringify(state.mine)); } catch (e) {}
    }

    function esc(value) {
      return String(value ?? '').replace(/[&<>"']/g, (ch) => ({
        '&': '&amp;',
        '<': '&lt;',
        '>': '&gt;',
        '"': '&quot;',
        "'": '&#39;'
      }[ch]));
    }

    function normalize(value) {
      const mm = '၀၁၂၃၄၅၆၇၈၉';
      const text = String(value ?? '').toLowerCase();
      return text
        .replace(/[၀-၉]/g, (ch) => mm.indexOf(ch))
        .replace(/[×✕*]/g, 'x')
        .replace(/\s*x\s*/g, 'x')
        .replace(/(st|nd|rd|th|street|road)\b/g, '')
        .replace(/လမ်း/g, ' street ')
        .replace(/\s+/g, ' ')
        .trim();
    }

    function brandOf(shop) {
      return shop && shop.brand_name ? shop.brand_name : 'CoCo';
    }

    function phoneDigits(value) {
      return String(value || '').split('/')[0].replace(/[^\d+]/g, '');
    }

    function mapsUrl(shop) {
      if (!shop) return '#';
      if (shop.lat && shop.lng) {
        return 'https://www.google.com/maps/search/?api=1&query=' + encodeURIComponent(shop.lat + ',' + shop.lng);
      }
      const term = shop.maps_q || `${brandOf(shop)} ${shop.address_mm || shop.name || ''} Mandalay`;
      return 'https://www.google.com/maps/search/?api=1&query=' + encodeURIComponent(term);
    }

    function nearUrl(term) {
      if (!term) return 'https://www.google.com/maps';
      const p = state.pos;
      if (p) {
        return `https://www.google.com/maps/search/${encodeURIComponent(term)}/@${p.lat},${p.lng},16z`;
      }
      return 'https://www.google.com/maps/search/' + encodeURIComponent(term + ' Mandalay');
    }

    function distanceKm(lat1, lon1, lat2, lon2) {
      const toRad = (deg) => (deg * Math.PI) / 180;
      const r = 6371;
      const dLat = toRad(lat2 - lat1);
      const dLon = toRad(lon2 - lon1);
      const a = Math.sin(dLat / 2) ** 2 + Math.cos(toRad(lat1)) * Math.cos(toRad(lat2)) * Math.sin(dLon / 2) ** 2;
      return 2 * r * Math.asin(Math.sqrt(a));
    }

    function renderBrandFilters() {
      const html = BRANDS.map(([value, label]) => `
        <button type="button" class="chip ${state.brand === value ? 'active' : ''}" data-brand="${esc(value)}">${esc(label)}</button>
      `).join('');
      $('#brands').innerHTML = html;

      $$('#brands .chip').forEach((button) => {
        button.addEventListener('click', () => {
          state.brand = button.dataset.brand;
          render();
        });
      });
    }

    function renderTownFilters() {
      const towns = [...new Set(state.shops.concat(state.mine).map((s) => s.township_mm).filter(Boolean))].sort();
      const items = [['all', 'မြို့နယ်အားလုံး'], ...towns.map((t) => [t, t])];
      $('#filters').innerHTML = items.map(([value, label]) => `
        <button type="button" class="chip ${state.town === value ? 'active' : ''}" data-town="${esc(value)}">${esc(label)}</button>
      `).join('');

      $$('#filters .chip').forEach((button) => {
        button.addEventListener('click', () => {
          state.town = button.dataset.town;
          render();
        });
      });
    }

    function renderLive() {
      const brand = BRANDS.find(([v]) => v === state.brand) || BRANDS[0];
      const searchTerm = (brand[2] || 'minimart convenience store') + (state.q.trim() ? ' ' + state.q.trim() : '');
      const buttons = (state.brand === 'all' ? BRANDS.slice(1) : [brand]).map(([v, label, term]) => {
        const value = term || label;
        return `<a class="act" target="_blank" rel="noopener noreferrer" href="${nearUrl(value + (state.q.trim() ? ' ' + state.q.trim() : ''))}">${esc(label)}</a>`;
      }).join('');

      $('#live').innerHTML = `
        <div class="live">
          <h3>🗺️ Google Maps မှာ တိုက်ရိုက်ရှာမည်</h3>
          <div class="actions">
            ${buttons}
          </div>
        </div>
      `;
    }

    function render() {
      renderBrandFilters();
      renderTownFilters();
      renderLive();

      const q = normalize(state.q).split(/\s+/).filter(Boolean);
      let rows = state.shops.concat(state.mine).filter((shop) => {
        const hay = normalize([
          brandOf(shop),
          shop.name,
          shop.branch,
          shop.address_mm,
          shop.township_mm,
          shop.phone,
          shop.source,
          shop.maps_q || ''
        ].join(' '));

        const brandMatch = state.brand === 'all' || brandOf(shop) === state.brand;
        const townMatch = state.town === 'all' || shop.township_mm === state.town;
        const favMatch = !state.favOnly || state.favs.has(shop.id);
        const queryMatch = q.every((term) => hay.includes(term));
        const delMatch = !state.del || !!(shop.foodpanda_url || shop.phone || shop.source_url);

        return brandMatch && townMatch && favMatch && queryMatch && delMatch;
      });

      if (state.pos) {
        rows = rows.map((shop) => ({
          ...shop,
          _d: shop.lat && shop.lng ? distanceKm(state.pos.lat, state.pos.lng, shop.lat, shop.lng) : null
        })).sort((a, b) => (a._d ?? Number.MAX_SAFE_INTEGER) - (b._d ?? Number.MAX_SAFE_INTEGER));
      }

      $('#count').textContent = `${rows.length} ဆိုင် (ဒေတာထဲမှာ)`;

      if (!rows.length) {
        $('#cards').innerHTML = '<div class="empty">မည်သည့်အချက်အလက်မျှ မတွေ့ပါ။ အခြားစကားလုံးဖြင့် ရှာပါ။</div>';
        return;
      }

      $('#cards').innerHTML = rows.map((shop, index) => {
        const phone = phoneDigits(shop.phone);
        const isFav = state.favs.has(shop.id);
        const distanceText = state.pos && shop._d ? `<div class="dist">📍 ${shop._d.toFixed(1)} km</div>` : '';
        const phoneHtml = phone
          ? `<div class="phone"><a href="tel:${encodeURIComponent(phone)}">☎ ${esc(shop.phone)}</a></div>`
          : '<div class="phone">📞 ဖုန်းနံပါတ် မရှိပါ</div>';
        const foodpanda = shop.foodpanda_url
          ? `<a class="mini-btn" target="_blank" rel="noopener noreferrer" href="${shop.foodpanda_url}">Foodpanda</a>`
          : '';
        const mapLink = `<a class="mini-btn" target="_blank" rel="noopener noreferrer" href="${mapsUrl(shop)}">Google Maps</a>`;
        const shareLink = `<button type="button" class="mini-btn" data-share="${index}">Share</button>`;
        const removeBtn = shop.id && shop.id.startsWith('my-') ? `<button type="button" class="mini-btn" data-remove="${shop.id}">Delete</button>` : '';

        return `
          <article class="card">
            <div class="top">
              <div>
                <div class="name">${esc(brandOf(shop))} ${esc(shop.branch || shop.name || '')}</div>
                <div class="meta">${esc(shop.township_mm || 'Mandalay')}</div>
              </div>
              <button type="button" class="fav ${isFav ? 'on' : ''}" data-fav="${esc(shop.id)}" aria-label="Favourite">★</button>
            </div>
            ${distanceText}
            <div class="addr">${esc(shop.address_mm || shop.name || 'လိပ်စာမရှိပါ')}</div>
            ${phoneHtml}
            <div class="tags">
              <span class="tag2">${esc(shop.confidence || 'unknown')}</span>
              ${shop.source ? `<span class="tag2">${esc(shop.source)}</span>` : ''}
            </div>
            <div class="actions-row">
              ${mapLink}
              ${foodpanda}
              ${shareLink}
              ${removeBtn}
            </div>
          </article>
        `;
      }).join('');

      $$('#cards [data-fav]').forEach((button) => {
        button.addEventListener('click', () => {
          const id = button.dataset.fav;
          if (state.favs.has(id)) {
            state.favs.delete(id);
          } else {
            state.favs.add(id);
          }
          saveFavs();
          render();
        });
      });

      $$('#cards [data-share]').forEach((button) => {
        button.addEventListener('click', () => {
          const shop = rows[Number(button.dataset.share)];
          const shareText = `${brandOf(shop)} ${shop.branch || ''}\n${shop.address_mm || ''}\n${shop.phone || ''}\n${mapsUrl(shop)}`;
          if (navigator.share) {
            navigator.share({ title: 'Mandalay Minimart', text: shareText }).catch(() => {});
          } else {
            navigator.clipboard?.writeText(shareText).then(() => toast('Share text copied to clipboard.'));
          }
        });
      });

      $$('#cards [data-remove]').forEach((button) => {
        button.addEventListener('click', () => {
          const id = button.dataset.remove;
          state.mine = state.mine.filter((shop) => shop.id !== id);
          saveMine();
          render();
          toast('Added shop deleted.');
        });
      });
    }

    function loadData() {
      const candidates = ['shops.json', 'data/shops.json'];
      let index = 0;

      function next() {
        if (index >= candidates.length) {
          $('#count').textContent = 'ဒေတာဖတ်မရပါ';
          $('#cards').innerHTML = '<div class="empty">သင့်ဒေတာဖိုင်ကိုမတွေ့ပါ။ shops.json ကို စစ်ဆေးပါ။</div>';
          return;
        }

        fetch(candidates[index])
          .then((response) => {
            if (!response.ok) throw new Error('Failed');
            return response.json();
          })
          .then((payload) => {
            state.shops = Array.isArray(payload.shops) ? payload.shops : [];
            state.mine = JSON.parse(localStorage.getItem('mine') || '[]');
            state.favs = new Set(JSON.parse(localStorage.getItem('favs') || '[]'));
            render();
          })
          .catch(() => {
            index += 1;
            next();
          });
      }

      next();
    }

    $('#searchForm').addEventListener('submit', (event) => {
      event.preventDefault();
      state.q = $('#search').value.trim();
      render();
    });

    $('#search').addEventListener('input', () => {
      state.q = $('#search').value.trim();
      render();
    });

    $('#locBtn').addEventListener('click', () => {
      if (!navigator.geolocation) {
        toast('ဒီ device မှာ location အားသုံးမရပါ');
        return;
      }
      toast('တည်နေရာကို ရှာနေသည်…');
      navigator.geolocation.getCurrentPosition(
        (position) => {
          state.pos = {
            lat: position.coords.latitude,
            lng: position.coords.longitude
          };
          toast('တည်နေရာ ရပြီ ✓');
          render();
        },
        () => toast('တည်နေရာ ရယူနိုင်ခဲ့ပါ။')
      );
    });

    $('#delBtn').addEventListener('click', () => {
      state.del = !state.del;
      $('#delBtn').classList.toggle('active', state.del);
      render();
    });

    $('#favBtn').addEventListener('click', () => {
      state.favOnly = !state.favOnly;
      $('#favBtn').classList.toggle('active', state.favOnly);
      render();
    });

    $('#close').addEventListener('click', () => {
      $('#dialog').close();
    });

    $('#fCancel').addEventListener('click', () => {
      $('#dialog').close();
    });

    let fPos = null;

    $('#fGps').addEventListener('click', () => {
      if (!navigator.geolocation) {
        toast('GPS မရနိုင်ပါ');
        return;
      }
      toast('တည်နေရာယူနေသည်…');
      navigator.geolocation.getCurrentPosition(
        (position) => {
          fPos = {
            lat: position.coords.latitude,
            lng: position.coords.longitude
          };
          $('#fGps').textContent = '✓ တည်နေရာရပြီ';
          toast('တည်နေရာရပြီ');
        },
        () => toast('တည်နေရာမရခဲ့ပါ')
      );
    });

    $('#addForm').addEventListener('submit', (event) => {
      event.preventDefault();
      const data = {
        id: 'my-' + Date.now(),
        brand_name: $('#fBrand').value,
        name: $('#fName').value.trim(),
        branch: '',
        address_mm: $('#fAddr').value.trim(),
        township_mm: $('#fTown').value.trim(),
        phone: $('#fPhone').value.trim(),
        source: 'Added by user',
        confidence: 'user-added',
        lat: fPos ? fPos.lat : undefined,
        lng: fPos ? fPos.lng : undefined,
        maps_q: `${$('#fBrand').value} ${$('#fAddr').value.trim()} ${$('#fTown').value.trim()} Mandalay`
      };

      state.mine.push(data);
      saveMine();
      $('#dialog').close();
      $('#addForm').reset();
      $('#fGps').textContent = '📍 တည်နေရာယူမည်';
      toast('ဆိုင်အသစ် ထည့်ပြီးပါပြီ');
      render();
    });

    loadData();
  </script>
</body>
</html>
